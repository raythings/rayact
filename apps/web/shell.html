<!DOCTYPE html>
<!--
  Emscripten --shell-file TEMPLATE for the Rayact web host. NOT a runnable page.

  Opening this file directly in a browser launches nothing: there is no engine,
  no app bundle and no project here, so you get an empty canvas behind the
  loading overlay. That is expected, not a failure.

  emcc substitutes the {{{ SCRIPT }}} placeholder at the end of <body> with the
  generated <script src="rayact.js"> and emits rayact.html next to the wasm; that
  output is the page to open. See apps/web/CMakeLists.txt (LINK_FLAGS
  --shell-file) and CLAUDE.md for how to build and serve a project.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rayact (Web / WebGPU)</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #12121a; color: #ddd; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { overflow: hidden; }
    #wrap { position: fixed; inset: 0; display: grid; place-items: center; }
    canvas {
      /* Matches the page background: any beat where the compositor shows the
         canvas before a frame lands (e.g. mid-drag resize) blends instead of
         flashing black. */
      background: #12121a;
      display: block;
      width: 100vw;
      height: 100vh;
      box-sizing: border-box;
    }
    /* The canvas is focusable (tabindex="0") only so it can capture keyboard
       input, and the pointer handlers focus it programmatically on every press —
       which Chrome treats as :focus-visible, drawing a focus ring around the
       entire viewport on any click. That ring marks the whole app, so it says
       nothing about what is actually focused; rayact paints its own focus
       affordances inside the scene (M3 field outlines, state layers), which is
       the indicator a user should see. Both selectors: :focus-visible carries
       its own UA outline and does not inherit the :focus reset. */
    #canvas:focus,
    #canvas:focus-visible { outline: none; }
    /* Hybrid composition: platform elements and overlay canvases are stacked
       above the base canvas in composite order, so framework content painted
       after a platform view genuinely covers it. The layer itself never takes
       pointer events; individual platform elements opt in. */
    #rayact-pv-layer { position: absolute; inset: 0; pointer-events: none; }
    #rayact-pv-layer > * { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
    #rayact-pv-layer canvas { width: 100%; height: 100%; background: transparent; }
    #rayact-pv-layer input, #rayact-pv-layer textarea {
      border: 0; margin: 0; padding: 0; background: transparent; box-sizing: border-box;
      outline: none; color: inherit; font: inherit; resize: none;
    }
    #rayact-pv-layer input::placeholder,
    #rayact-pv-layer textarea::placeholder {
      color: var(--rayact-placeholder-color, currentColor);
      opacity: 1; /* Firefox dims placeholders by default */
    }
    #rayact-pv-layer input::selection,
    #rayact-pv-layer textarea::selection {
      background: var(--rayact-selection-color, Highlight);
    }
    #unsupported {
      display: none;
      max-width: 560px;
      margin: 24px;
      padding: 20px;
      border: 1px solid #363646;
      border-radius: 8px;
      background: #191923;
      color: #f3f3f7;
      line-height: 1.45;
    }
    #unsupported h1 { margin: 0 0 8px; font-size: 20px; font-weight: 650; }
    #unsupported p { margin: 0; color: #c7c7d2; }
    #rayact-loading {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      background: #12121a;
      transition: opacity 160ms ease;
    }
    #rayact-loading[hidden] { display: none; }
    .rayact-loading-card { display: grid; justify-items: center; gap: 12px; padding: 28px; text-align: center; }
    .rayact-spinner {
      width: 34px;
      height: 34px;
      border: 3px solid #343445;
      border-top-color: #a9c7ff;
      border-radius: 50%;
      animation: rayact-spin 800ms linear infinite;
    }
    .rayact-loading-title { color: #f3f3f7; font-size: 18px; font-weight: 650; }
    .rayact-loading-detail { color: #aaaab8; font-size: 13px; }
    @keyframes rayact-spin { to { transform: rotate(360deg); } }
    body.rayact-unsupported canvas,
    body.rayact-unsupported .rayact-ime,
    body.rayact-unsupported #rayact-loading { display: none; }
    body.rayact-unsupported #unsupported { display: block; }
    .rayact-ime {
      position: fixed;
      left: -1000px;
      top: -1000px;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
      resize: none;
      border: 0;
      padding: 0;
      outline: 0;
    }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="canvas" width="960" height="540" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>
    <div id="rayact-pv-layer"></div>
    <input id="rayact-ime-input" class="rayact-ime" autocomplete="off" autocapitalize="none" spellcheck="false">
    <textarea id="rayact-ime-textarea" class="rayact-ime" autocomplete="off" autocapitalize="none" spellcheck="false"></textarea>
    <section id="rayact-loading" role="status" aria-live="polite">
      <div class="rayact-loading-card">
        <div class="rayact-spinner" aria-hidden="true"></div>
        <div class="rayact-loading-title">Preparing project</div>
        <div id="rayact-loading-detail" class="rayact-loading-detail">Loading the initial project files…</div>
      </div>
    </section>
    <section id="unsupported" role="alert" aria-live="polite">
      <h1>WebGPU is not available</h1>
      <p>Rayact Web requires a browser with WebGPU enabled and cross-origin isolation headers. Use a current Chrome or Edge build, then reload this page.</p>
    </section>
  </div>
  <script>
    if (!navigator.gpu) {
      document.body.classList.add('rayact-unsupported');
    }

    // Browsers cannot browse raw mDNS. The web launcher receives the resolved
    // server as ?dev=<origin>; start warming that server immediately, before
    // the WASM runtime has downloaded and initialized.
    var rayactDevMatch = (location.search || '').match(/[?&]dev=([^&]+)/);
    var rayactDevBase = rayactDevMatch
      ? decodeURIComponent(rayactDevMatch[1]).replace(/\/+$/, '')
      : '';
    var rayactPrefetchCache = new Map();
    var rayactPrefetchBytes = 0;
    var rayactPrefetchLimit = 16 * 1024 * 1024;
    var rayactPrefetchFileLimit = 4 * 1024 * 1024;

    function rayactAbsoluteUrl(url) {
      try {
        var resolved = new URL(url, rayactDevBase || location.href);
        if (rayactDevBase && resolved.pathname.indexOf('/rayact/') === 0) {
          var selected = new URL(rayactDevBase);
          resolved.protocol = selected.protocol;
          resolved.hostname = selected.hostname;
          resolved.port = selected.port;
        }
        return resolved.href;
      }
      catch (_) { return url; }
    }

    function rayactCacheResponse(url, bytes, revision) {
      if (!bytes || bytes.byteLength > rayactPrefetchFileLimit) return false;
      if (rayactPrefetchBytes + bytes.byteLength > rayactPrefetchLimit) return false;
      var key = rayactAbsoluteUrl(url);
      if (rayactPrefetchCache.has(key)) return true;
      rayactPrefetchCache.set(key, { bytes: bytes, revision: revision });
      rayactPrefetchBytes += bytes.byteLength;
      return true;
    }

    async function rayactFetchBytes(url) {
      var controller = new AbortController();
      var timeout = setTimeout(function() { controller.abort(); }, 5000);
      try {
        var response = await fetch(rayactAbsoluteUrl(url), {
          cache: 'no-store',
          signal: controller.signal,
        });
        if (!response.ok) throw new Error('HTTP ' + response.status + ' from ' + url);
        return new Uint8Array(await response.arrayBuffer());
      } finally {
        clearTimeout(timeout);
      }
    }

    window.__rayactDevPrefetchReady = rayactDevBase ? (async function() {
      try {
        var manifestUrl = rayactDevBase + '/rayact/manifest.json?platform=web';
        var manifestBytes = await rayactFetchBytes(manifestUrl);
        var manifest = JSON.parse(new TextDecoder().decode(manifestBytes));
        var revision = Number(manifest.revision == null ? -1 : manifest.revision);
        rayactCacheResponse(manifestUrl, manifestBytes, revision);

        var critical = [];
        var assets = [];
        if (manifest.bundleFormat === 'qjsbc' && manifest.bundleUrl) {
          critical.push({ url: manifest.bundleUrl, size: 0 });
        } else {
          if (manifest.bootstrapUrl) critical.push({ url: manifest.bootstrapUrl, size: 0 });
          if (manifest.entryModuleUrl) critical.push({ url: manifest.entryModuleUrl, size: 0 });
        }
        (Array.isArray(manifest.assets) ? manifest.assets.slice(0, 32) : []).forEach(function(asset) {
          var size = Number(asset && asset.size || 0);
          if (asset && asset.url && size >= 0 && size <= rayactPrefetchFileLimit) {
            assets.push({ url: asset.url, size: size });
          }
        });

        // Native web modules (side-module wasm). Release injects the list as a
        // global at stage time; dev takes it from the manifest. preRun waits on
        // this same promise before loading them, so setting it here is in time.
        window.__rayactWebModules = (Array.isArray(manifest.webModuleWasm) ? manifest.webModuleWasm : [])
          .map(function(module) { return module && module.url; })
          .filter(Boolean);

        // Browser-side module scripts (@rayact/webview and friends). A release
        // build gets <script> tags injected at stage time; this page is served
        // byte-for-byte in dev, so the tags are added here from the manifest.
        // Not awaited: the platform-view registry parks creates for kinds whose
        // factory has not registered yet and replays them when it does.
        (Array.isArray(manifest.webModuleScripts) ? manifest.webModuleScripts : [])
          .forEach(function(module) {
            if (!module || !module.url) return;
            var script = document.createElement('script');
            script.src = rayactAbsoluteUrl(module.url);
            script.async = false;   // preserve declaration order between modules
            script.onerror = function() {
              console.error('[rayact-web] failed to load module script: ' + module.name);
            };
            document.head.appendChild(script);
          });

        async function warmResource(resource) {
          if (resource.size && rayactPrefetchBytes + resource.size > rayactPrefetchLimit) return;
          try {
            var bytes = await rayactFetchBytes(resource.url);
            rayactCacheResponse(resource.url, bytes, revision);
          } catch (error) {
            console.debug('[rayact-web] startup prefetch skipped:', error);
          }
        }

        // Bootstrap and entry are the only pre-run dependency. Assets continue
        // warming opportunistically and can never hold the first frame hostage.
        await Promise.all(critical.map(warmResource));
        void Promise.all(assets.map(warmResource)).then(function() {
          console.log('[rayact-web] prefetched ' + rayactPrefetchCache.size + ' startup files');
        });
      } catch (error) {
        console.warn('[rayact-web] dev prefetch unavailable:', error);
      }
    })() : Promise.resolve();

    var Module = {
      canvas: (function() { return document.getElementById('canvas'); })(),
      print: function(text) { console.log(text); },
      printErr: function(text) { console.error(text); },
      // Consumer bundles: fetch a same-origin app bundle into MEMFS before
      // main() runs, so loadBundledApp() finds /app.qjsbc or /app.js without
      // the bundle being embedded at link time. Missing files are fine (the
      // host falls through to ?dev= or the demo).
      preRun: [function() {
        // Native web modules (@rayact/svg and friends) are Emscripten SIDE_MODULEs the
        // host dlopens, the peer of desktop's .dylib. This only stages the bytes into
        // MEMFS; the host loads them from /rayact-modules during boot.
        //
        // The split matters. dlopen'ing here would be too early: Emscripten places a
        // side module's data segment with getMemory(), which bump-allocates from the
        // heap base until runtimeInitialized is set, and the allocator then hands the
        // same region out again — the engine dies with "memory access out of bounds"
        // during engineCreate, nowhere near the cause. Fetching is safe though, and
        // doing it here keeps the network wait off the boot path.
        //
        // In dev the list arrives with the manifest, so wait for that fetch first.
        addRunDependency('rayact-modules');
        Promise.resolve(rayactDevBase ? window.__rayactDevPrefetchReady : null)
          .catch(function() {})
          .then(function() {
            var modules = window.__rayactWebModules;
            if (!Array.isArray(modules) || !modules.length) return;
            try { FS.mkdirTree('/rayact-modules'); } catch (e) { /* already exists */ }
            return Promise.all(modules.map(function(module) {
              var url = typeof module === 'string' ? module : (module && module.url);
              if (!url) return null;
              var name = url.split('/').pop().split('?')[0];
              var target = '/rayact-modules/' + name;
              return fetch(rayactAbsoluteUrl(url)).then(function(res) {
                if (!res.ok) throw new Error(url + ': ' + res.status);
                return res.arrayBuffer();
              }).then(function(buf) {
                FS.writeFile(target, new Uint8Array(buf));
              }).catch(function(error) {
                // Never fatal: the app boots without that module's node kinds.
                console.error('[rayact-web] module fetch failed: ' + error.message);
              });
            }));
          })
          .catch(function() {})
          .then(function() { removeRunDependency('rayact-modules'); });

        if (rayactDevBase) {
          addRunDependency('rayact-dev-prefetch');
          Promise.resolve(window.__rayactDevPrefetchReady).finally(function() {
            removeRunDependency('rayact-dev-prefetch');
          });
          return;
        }
        addRunDependency('rayact-app-bundle');
        var tryLoad = function(name, next) {
          fetch(name).then(function(res) {
            if (!res.ok) throw new Error(String(res.status));
            return res.arrayBuffer();
          }).then(function(buf) {
            FS.writeFile('/' + name, new Uint8Array(buf));
            removeRunDependency('rayact-app-bundle');
          }).catch(function() {
            if (next) next(); else removeRunDependency('rayact-app-bundle');
          });
        };
        tryLoad('app.qjsbc', function() { tryLoad('app.js', null); });
        // Runtime assets (CSS the bundle importCSS()es): `rayact build --web`
        // stages the files next to the bundle and lists them in app-assets.json;
        // mirror that tree into MEMFS so filesystem loads resolve at boot.
        addRunDependency('rayact-app-assets');
        fetch('app-assets.json').then(function(res) {
          if (!res.ok) throw new Error(String(res.status));
          return res.json();
        }).then(function(list) {
          if (!Array.isArray(list)) return;
          return Promise.all(list.map(function(rel) {
            return fetch(rel).then(function(res) {
              if (!res.ok) throw new Error(rel + ': ' + res.status);
              return res.arrayBuffer();
            }).then(function(buf) {
              var dir = '/' + rel.split('/').slice(0, -1).join('/');
              if (dir !== '/') FS.mkdirTree(dir);
              FS.writeFile('/' + rel, new Uint8Array(buf));
            });
          }));
        }).catch(function() {}).then(function() {
          removeRunDependency('rayact-app-assets');
        });
      }],
      __rayactPrefetchCache: rayactPrefetchCache,
      __rayactActiveRevision: null,
      __rayactSetLoading: function(visible, detail) {
        var loading = document.getElementById('rayact-loading');
        var detailEl = document.getElementById('rayact-loading-detail');
        if (detailEl && detail) detailEl.textContent = detail;
        if (loading) loading.hidden = !visible;
      }
    };
    window.Module = Module;
    (function() {
      var encoder = new TextEncoder();
      var activeNode = -1;
      var activeEl = null;
      var composing = false;
      var globalImeValue = '';
      var activeBlurOnSubmit = true;
      var canvas = document.getElementById('canvas');
      var lastPointerEventTime = 0;
      var mouseFallbackDown = false;

      // Calling an exported native function before the wasm runtime has
      // finished initializing triggers emscripten's `assert(runtimeInitialized)`
      // which ABORTS the whole module (permanent black screen). The exported
      // wrappers exist on Module immediately, so a `typeof` check is not enough —
      // gate every native call on this readiness flag, set once the runtime is up.
      var runtimeReady = false;
      var prevOnRuntimeInit = Module.onRuntimeInitialized;
      Module.onRuntimeInitialized = function() {
        runtimeReady = true;
        if (typeof prevOnRuntimeInit === 'function') prevOnRuntimeInit();
      };

      function canvasPoint(eventLike) {
        if (!canvas) return null;
        var rect = canvas.getBoundingClientRect();
        if (!rect.width || !rect.height) return null;
        // Report CSS-logical pixels. The engine hit-tests in logical/dp space
        // (dp == CSS px), while the canvas backing store is device px (CSS x dpr).
        // Do NOT scale by canvas.width/rect.width or touches land off by dpr.
        return {
          x: eventLike.clientX - rect.left,
          y: eventLike.clientY - rect.top
        };
      }

      // The PAGE owns the canvas resolution: size the backing store to the CSS box
      // times devicePixelRatio so the engine renders crisply into real device
      // pixels. The engine only READS this (it never resizes the canvas). Native's
      // resize notification (rayactWebNotifyResize) calls this before re-reading,
      // and we size once here so the very first InitPlatform reads a real backing.
      // Rayact policy (mirrors the desktop host's rlmtSetMinRenderScale(2)):
      // rasterize at no less than 2x, even on 1x displays. Text and icons baked
      // at density 1 read as blurry on low-DPI monitors; rendering 2x and
      // letting the browser downsample gives them the raster density mobile
      // gets natively. Returns the multiplier to apply ON TOP of the exact
      // device-pixel size (1 on 2x+ displays — the exact path stays untouched).
      function rayactExtraRenderScale() {
        var dpr = window.devicePixelRatio || 1;
        return Math.max(1, 2 / dpr);
      }

      // Prefer the exact device-pixel size from ResizeObserver's
      // devicePixelContentBoxSize (passed through by the runtime): computing
      // round(clientWidth) x dpr can disagree with the element's true device
      // pixel width by one pixel on fractional CSS sizes (100vw is rarely
      // integral), and a canvas whose backing store is scaled by even 1px
      // renders every glyph blurry.
      function resizeCanvasBacking(exactW, exactH) {
        if (!canvas) return false;
        var extra = rayactExtraRenderScale();
        var bw, bh;
        if (typeof exactW === 'number' && exactW > 0 &&
            typeof exactH === 'number' && exactH > 0) {
          bw = Math.max(1, Math.round(exactW * extra));
          bh = Math.max(1, Math.round(exactH * extra));
        } else {
          var dpr = window.devicePixelRatio || 1;
          var cssW = Math.max(1, canvas.clientWidth || window.innerWidth || 1);
          var cssH = Math.max(1, canvas.clientHeight || window.innerHeight || 1);
          bw = Math.max(1, Math.round(cssW * dpr * extra));
          bh = Math.max(1, Math.round(cssH * dpr * extra));
        }
        if (canvas.width === bw && canvas.height === bh) return false;
        canvas.width = bw;
        canvas.height = bh;
        return true;
      }
      Module.__rayactResizeCanvas = resizeCanvasBacking;
      resizeCanvasBacking();

      // ---------------------------------------------------------------------
      // Platform views (hybrid composition)
      //
      // native/web/web_platform_views.cpp drives this from raym3's render walk.
      // Per frame: beginFrame, then one composite() per platform view in paint
      // order, then endFrame. composite() positions the real DOM element from
      // the mutator stack and returns the rlwg surface id of an overlay canvas;
      // everything raym3 paints after that goes into the overlay, which sits
      // above the element. That ordering is the whole point — an element merely
      // layered on top could never be occluded by framework content.
      //
      // Geometry arrives in dp, which on web is CSS px.
      // ---------------------------------------------------------------------
      (function installPlatformViews() {
        var layer = document.getElementById('rayact-pv-layer');
        if (!layer) return;

        var views = {};            // nodeId -> { el, kind, surfaceId }
        var overlays = [];         // pooled { canvas, surfaceId, registered }
        var overlayCursor = 0;
        var activeThisFrame = {};
        var OVERLAY_SURFACE_BASE = 1000;

        // ── platform view registry ────────────────────────────────────────────
        //
        // Modules (e.g. @rayact/webview) own platform views of a given kind, the
        // browser peer of Android's RayactPlatformRegistry.registerViewFactory and
        // the desktop ABI's register_view_factory. A factory receives
        // { nodeId, props, emit } and returns a controller { el, applyProps?,
        // dispose? }.
        //
        // Module scripts are plain <script> tags whose load order relative to the
        // wasm host is not guaranteed, so they never touch Module: they push a
        // callback onto window.__rayactModuleRegistrations, drained here. Creates
        // for a kind nobody has claimed yet are PARKED and replayed when its
        // factory arrives — the same idea as the desktop host's
        // rayactReplayExternalViewCreates. That makes load order irrelevant in
        // both the release and dev flows.
        var viewFactories = {};

        // Browser implementations of platform modules (sensors, haptics, ...),
        // reached from JS through platformCall() and native/web/
        // web_platform_modules.cpp. A handler is (method, payload) -> value; it
        // may also return an explicit { ok:false, error } to signal failure.
        var platformModules = {};

        var registry = {
          registerViewFactory: function(kind, factory) {
            if (!kind || typeof factory !== 'function') return;
            if (viewFactories[kind]) return;   // first registration wins
            viewFactories[kind] = factory;
            replayParkedCreates(kind);
          },
          registerModule: function(name, handler) {
            if (!name || typeof handler !== 'function') return;
            if (platformModules[name]) return;  // first registration wins
            platformModules[name] = handler;
          }
        };
        Module.__rayactPlatformViewRegistry = registry;

        // Called synchronously from wasm. Must always return a JSON string, or
        // null when no module owns the name so the caller can report the same
        // "unavailable" error every other host uses.
        Module.__rayactPlatformModules = {
          call: function(name, method, payloadJson) {
            var handler = platformModules[name];
            if (!handler) return null;
            var payload = null;
            try { payload = JSON.parse(payloadJson); } catch (e) {}
            try {
              var value = handler(method, payload);
              // A handler may answer with the full envelope itself.
              if (value && typeof value === 'object' && typeof value.ok === 'boolean') {
                return JSON.stringify(value);
              }
              return JSON.stringify({ ok: true, value: value === undefined ? null : value });
            } catch (error) {
              return JSON.stringify({
                ok: false,
                error: (error && error.message) ? error.message : String(error)
              });
            }
          }
        };

        // A module script can arrive after its views were created — the engine
        // commits the tree as soon as the app mounts. Parked views hold their
        // accumulated props until the factory shows up, then instantiate as if
        // they had been there all along.
        function replayParkedCreates(kind) {
          for (var nodeId in views) {
            var view = views[nodeId];
            if (view.parked && view.kind === kind) instantiateView(view);
          }
        }

        function drainRegistrations() {
          var queue = window.__rayactModuleRegistrations;
          if (queue && queue.length) {
            for (var i = 0; i < queue.length; i++) {
              try { queue[i](registry); }
              catch (e) { console.error('[rayact-web] module registration failed:', e); }
            }
            queue.length = 0;
          }
          // Anything pushed from here on registers immediately.
          window.__rayactModuleRegistrations = {
            push: function(callback) {
              try { callback(registry); }
              catch (e) { console.error('[rayact-web] module registration failed:', e); }
              return 0;
            },
            length: 0
          };
        }

        function elementForKind(kind, props) {
          if (kind === 'rayact.internal.text-input') {
            var multiline = !!(props && props.multiline);
            var input = document.createElement(multiline ? 'textarea' : 'input');
            if (!multiline) input.type = 'text';
            return input;
          }
          return document.createElement('div');
        }

        function emit(nodeId, envelope) {
          if (typeof Module._rayactWebExternalViewEvent !== 'function') return;
          var ptr = stringToNewUTF8(JSON.stringify(envelope));
          try { Module._rayactWebExternalViewEvent(nodeId, ptr); }
          finally { _free(ptr); }
        }

        function wireTextInput(el, nodeId) {
          el.addEventListener('input', function() {
            emit(nodeId, { type: 'change', text: el.value });
          });
          el.addEventListener('focus', function() { emit(nodeId, { type: 'focus' }); });
          el.addEventListener('blur', function() { emit(nodeId, { type: 'blur' }); });
          el.addEventListener('select', function() {
            emit(nodeId, {
              type: 'selection', text: el.value,
              selectionStart: el.selectionStart || 0,
              selectionEnd: el.selectionEnd || 0
            });
          });
          el.addEventListener('keydown', function(event) {
            emit(nodeId, { type: 'key', key: event.key });
            if (event.key === 'Enter' && el.tagName !== 'TEXTAREA') {
              emit(nodeId, { type: 'submit', text: el.value });
            }
          });
        }

        function cssColor(value) {
          if (typeof value === 'number') {
            var r = (value >>> 24) & 0xff;
            var g = (value >>> 16) & 0xff;
            var b = (value >>> 8) & 0xff;
            var a = (value & 0xff) / 255;
            return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
          }
          return typeof value === 'string' ? value : '';
        }

        function applyProps(view, props) {
          var el = view.el;
          if (!props) return;
