pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "rayact"
include ':app'

def rayactAutolinkSettings = file('rayact-autolink-settings.gradle')
if (rayactAutolinkSettings.exists()) {
    apply from: rayactAutolinkSettings
}
