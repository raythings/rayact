name: Verify GitHub release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag, for example v0.0.5
        required: true

permissions:
  attestations: write
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Download locally built release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$RELEASE_TAG" --dir release1

      - name: Verify signed release set
        run: |
          node scripts/verify-release-set.mjs release1 --require-signature
          node scripts/verify-stable-gate.mjs release1
          cd release1
          sha256sum --check SHA256SUMS

      - name: Attest verified release assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release1/*
