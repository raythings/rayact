name: Promote GitHub release

on:
  workflow_dispatch:
    inputs:
      channel:
        type: choice
        options: [stable, rollback]
        required: true
      version:
        description: Existing GitHub release version without v, for example 0.0.5
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  promote:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "v${{ inputs.version }}" --dir release1
      - run: node scripts/verify-release-set.mjs release1 --require-signature
      - run: node scripts/verify-stable-gate.mjs release1
      - name: Update optional npm channel
        if: vars.RAYACT_PUBLISH_NPM == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/release-channel.mjs "${{ inputs.channel }}" release1
      - if: inputs.channel == 'stable' || inputs.channel == 'rollback'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "v${{ inputs.version }}" --latest
